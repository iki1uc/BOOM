<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>BOOM Indexer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body {
    background:#0b0e14; color:#e2e8f0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    margin:0; padding:20px;
  }
  h1 { font-size:20px; margin-bottom:4px; }
  p.sub { color:#94a3b8; margin-top:0; font-size:14px; max-width:700px; }
  #controls {
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    margin:16px 0; padding:14px; background:#161b26; border-radius:10px;
  }
  input {
    background:#0b0e14; border:1px solid #2d3748; color:#e2e8f0;
    padding:8px 10px; border-radius:6px; font-size:14px;
  }
  input#owner, input#repo { width:150px; }
  button {
    background:#3b82f6; color:white; border:none; padding:8px 16px;
    border-radius:6px; cursor:pointer; font-size:14px;
  }
  button:hover { background:#2563eb; }
  button:disabled { background:#334155; cursor:not-allowed; }
  #status { color:#94a3b8; font-size:14px; margin:10px 0; white-space:pre-line; }
  .folder-section { margin-bottom:28px; }
  .folder-title {
    font-size:16px; font-weight:600; margin-bottom:10px;
    padding-bottom:6px; border-bottom:1px solid #232938;
    display:flex; justify-content:space-between; align-items:center;
  }
  .folder-count { color:#64748b; font-size:13px; font-weight:normal; }
  #grid-wrap { display:flex; flex-direction:column; }
  .grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
    gap:10px;
  }
  .card {
    background:#161b26; border:1px solid #232938; border-radius:8px;
    overflow:hidden; font-size:11px;
  }
  .card img { width:100%; height:100px; object-fit:cover; display:block; background:#0b0e14; }
  .card .fname { padding:5px 6px; color:#94a3b8; word-break:break-all; }
  .non-image {
    padding:10px; color:#7dd3fc; font-size:12px; word-break:break-all;
  }
  #export-btn { margin-top:10px; }
</style>
</head>
<body>

<h1>BOOM Indexer</h1>
<p class="sub">Durchsucht automatisch alle Ordner im Repo und listet alle Dateien mit Vorschau, gruppiert nach Ordner.</p>

<div id="controls">
  <input id="owner" placeholder="GitHub-User" value="iki1uc">
  <input id="repo" placeholder="Repo" value="BOOM">
  <button onclick="loadRepoIndex()">Repo indizieren</button>
  <button id="export-btn" onclick="exportCSV()" disabled>Gesamtindex als CSV</button>
</div>

<div id="status"></div>
<div id="grid-wrap"></div>

<script>
let allFiles = [];

async function ghFetch(url){
  const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
  if(!res.ok){
    throw new Error(`GitHub API Fehler ${res.status} bei ${url}`);
  }
  return res.json();
}

async function loadRepoIndex(){
  const owner = document.getElementById('owner').value.trim();
  const repo = document.getElementById('repo').value.trim();
  const statusEl = document.getElementById('status');
  const wrapEl = document.getElementById('grid-wrap');

  if(!owner || !repo){ statusEl.textContent = 'Bitte User und Repo angeben.'; return; }

  statusEl.textContent = 'Lade Ordnerstruktur...';
  wrapEl.innerHTML = '';
  document.getElementById('export-btn').disabled = true;
  allFiles = [];

  try {
    const root = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/contents`);
    const folders = root.filter(f => f.type === 'dir');
    const rootFiles = root.filter(f => f.type === 'file');

    if(rootFiles.length){
      allFiles.push(...rootFiles.map(f => ({ ordner:'(root)', dateiname:f.name, url:f.download_url, typ: f.name.split('.').pop() })));
    }

    statusEl.textContent = `${folders.length} Ordner gefunden. Lade Inhalte...`;

    for(const folder of folders){
      try {
        const contents = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(folder.name)}`);
        const files = contents.filter(f => f.type === 'file');
        allFiles.push(...files.map(f => ({ ordner: folder.name, dateiname: f.name, url: f.download_url, typ: f.name.split('.').pop().toLowerCase() })));
        renderFolder(folder.name, files);
        statusEl.textContent = `Geladen: ${folder.name} (${files.length} Dateien)`;
      } catch(e){
        statusEl.textContent = `Fehler bei Ordner ${folder.name}: ${e.message}`;
      }
    }

    statusEl.textContent = `Fertig. ${allFiles.length} Dateien insgesamt in ${folders.length} Ordnern gefunden.`;
    document.getElementById('export-btn').disabled = false;

  } catch(err){
    statusEl.textContent = 'Fehler: ' + err.message;
  }
}

function renderFolder(name, files){
  const wrapEl = document.getElementById('grid-wrap');
  const section = document.createElement('div');
  section.className = 'folder-section';

  const imageFiles = files.filter(f => /\.(webp|png|jpg|jpeg|gif)$/i.test(f.name));
  const otherFiles = files.filter(f => !/\.(webp|png|jpg|jpeg|gif)$/i.test(f.name));

  let html = `<div class="folder-title">${name} <span class="folder-count">${files.length} Dateien</span></div><div class="grid">`;
  imageFiles.forEach(f => {
    html += `<div class="card"><img src="${f.download_url}" loading="lazy" alt="${f.name}"><div class="fname">${f.name}</div></div>`;
  });
  otherFiles.forEach(f => {
    html += `<div class="card"><div class="non-image">📄 ${f.name}</div></div>`;
  });
  html += `</div>`;

  section.innerHTML = html;
  wrapEl.appendChild(section);
}

function exportCSV(){
  const header = 'ordner,dateiname,typ,url\n';
  const rows = allFiles.map(f => {
    const esc = s => `"${(s||'').replace(/"/g,'""')}"`;
    return [esc(f.ordner), esc(f.dateiname), esc(f.typ), esc(f.url)].join(',');
  }).join('\n');
  const blob = new Blob([header + rows], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'boom-index.csv';
  link.click();
}

loadRepoIndex();
</script>

</body>
</html>
